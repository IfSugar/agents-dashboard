    <script>
      // Pick the theme before anything paints (no flash). "Auto" (the default) follows the sun in
      // Sofia: light from sunrise to sunset. Same maths as src/sun.ts — keep the two in step.
      (function () {
        var P = "ifsugar-agents:pref:", t = null, mode = null, o = null, now = new Date();
        try {
          mode = localStorage.getItem(P + "themeMode");
          o = JSON.parse(localStorage.getItem(P + "themeOverride") || "null");
        } catch (e) {}
        if (mode === "light" || mode === "dark") t = mode;
        else if (o && (o.theme === "light" || o.theme === "dark") && new Date(o.until) > now) t = o.theme;
        else {
          var R = Math.PI / 180, lat = 42.6977, lon = 23.3219, J70 = 2440587.5, J00 = 2451545;
          var noon = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
          var n = Math.round(noon.getTime() / 864e5 + J70 - J00 - 0.0009 + lon / 360);
          var js = J00 + 0.0009 - lon / 360 + n, M = (357.5291 + 0.98560028 * (js - J00)) % 360;
          var C = 1.9148 * Math.sin(M * R) + 0.02 * Math.sin(2 * M * R) + 0.0003 * Math.sin(3 * M * R);
          var L = (M + C + 180 + 102.9372) % 360, tr = js + 0.0053 * Math.sin(M * R) - 0.0069 * Math.sin(2 * L * R);
          var d = Math.asin(Math.sin(L * R) * Math.sin(23.4397 * R));
          var cw = (Math.sin(-0.833 * R) - Math.sin(lat * R) * Math.sin(d)) / (Math.cos(lat * R) * Math.cos(d));
          if (cw < -1 || cw > 1) t = now.getHours() >= 7 && now.getHours() < 19 ? "light" : "dark";
          else {
            var w = Math.acos(cw) / R / 360, ms = now.getTime();
            t = ms >= (tr - w - J70) * 864e5 && ms < (tr + w - J70) * 864e5 ? "light" : "dark";
          }
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
a {
  color: var(--primary-text);
}
[data-theme="dark"] a {
  color: var(--primary-text);
}
:focus-visible {
  outline: none;
  box-shadow: 0 0 0 0.2rem var(--focus-ring);
  border-radius: var(--radius);
}
h1,
h2,
h3 {
  margin: 0;
  font-weight: 600;
}
.muted {
  color: var(--text-2);
}
.small {
  font-size: 12.5px;
}
.strong {
  font-weight: 600;
}
.center {
  text-align: center;
}
.mono {
  font-family: var(--mono);
}
.icon {
  flex: none;
  display: inline-block;
  vertical-align: -0.15em;
}
.spacer {
  flex: 1;
}
.link {
  background: none;
  border: 0;
  padding: 0;
  color: var(--primary-text);
  text-decoration: underline;
  cursor: pointer;
  font-weight: 500;
}

/* ---------- layout ---------- */
.container {
  max-width: 1440px;
  margin: 0 auto;
  padding-left: 24px;
  padding-right: 24px;
}
.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.header-row {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 60px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-right: auto;
  min-width: 0;
}
.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  display: block;
  flex: none;
}
.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
  min-width: 0;
}
.brand-name {
  font-weight: 700;
  font-size: 15.5px;
  white-space: nowrap;
}
.brand-sub {
  font-size: 12px;
  color: var(--text-2);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none; /* the buttons keep their size; the name next to them wraps instead */
}
.header-actions .segmented {
  flex-wrap: nowrap; /* EN | БГ always on one line */
}
.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  overflow-y: hidden; /* sideways only: no up-and-down wobble (iOS bounce) while swiping the tabs */
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}
/* More tabs hidden off-screen: a soft fade on that edge (set by useEdgeFade in app.tsx). */
.tabs[data-more-right] {
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
}
.tabs[data-more-left] {
  -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent);
  mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent);
}
.tabs[data-more-left][data-more-right] {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent);
}
.tabs::-webkit-scrollbar {
  display: none;
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px 11px;
  border: 0;
  background: none;
  color: var(--text-2);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.tab:hover {
  color: var(--text);
}
.tab.active {
  color: var(--primary-text);
  border-bottom-color: var(--primary);
}
.tab:focus-visible {
  border-radius: var(--radius) var(--radius) 0 0;
}
.main {
  padding-top: 24px;
  padding-bottom: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.app.is-loading .main > .stack {
  opacity: 0.6;
  transition: opacity 0.2s;
}
.footer {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding-top: 8px;
  padding-bottom: 32px;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.grid-kpi {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 16px;
}
.grid-kpi.four {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.grid-2 {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
  gap: 16px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

/* ---------- card ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  min-width: 0;
}
.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.card-heading {
  flex: 1 1 320px; /* the title and its text fill the width beside the buttons */
  min-width: 0;
}
.card-header.stacked {
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
}
.card-header.stacked .card-heading {
  width: 100%;
  flex: none; /* in a column the 320px basis above would become a height */
}
.card-header.stacked .card-title {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-title {
  font-size: 15px;
}
.card-subtitle {
  margin: 2px 0 0;
  color: var(--text-2);
  font-size: 12.5px;
}
.card-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  max-width: 100%;
  min-width: 0;
}
.card-body {
  padding: 16px;
}
.card-body.flush {
  padding: 0;
}
.card-note {
  margin: 0;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
}

/* ---------- stat tiles ---------- */
.stat {
  padding: 14px 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stat-label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-2);
}
.stat-value {
  font-size: 26px;
  font-weight: 600;
  line-height: 1.2;
}
.stat-delta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  min-height: 18px;
}
.delta {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-weight: 600;
}
.delta-up {
  color: var(--delta-up);
}
.delta-down {
  color: var(--delta-down);
}
.delta-flat {
  color: var(--text-2);
}
.stat-note {
  font-size: 12px;
  color: var(--text-2);
}
.chart-notes {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  font-size: 12px;
  color: var(--text-2);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sparkline {
  height: 36px;
  margin-top: 6px;
}

/* ---------- filters / segmented ---------- */
.filters {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px 20px;
}
.filter-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filter-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.filters-meta {
  margin-left: auto;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  padding-bottom: 6px;
}
.segmented {
  display: inline-flex;
  flex-wrap: wrap; /* on a narrow screen the choices go onto a second line instead of scrolling */
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2px;
  gap: 2px;
}
.segmented button {
  border: 0;
  background: transparent;
  color: var(--text-2);
  padding: 5px 12px;
  border-radius: calc(var(--radius) - 2px);
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.segmented button:hover {
  color: var(--text);
  background: var(--surface-3);
}
.segmented button.active {
  background: var(--primary);
  color: #fff;
}
.segmented-sm button {
  padding: 3px 9px;
  font-size: 12.5px;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
  text-decoration: none;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.btn-sm {
  height: 28px;
  padding: 0 9px;
  font-size: 12.5px;
}
.btn-icon {
  width: 34px;
  padding: 0;
}
.btn-sm.btn-icon {
  width: 28px;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover:not(:disabled) {
  background: var(--primary-hover);
}
.btn-outline {
  border-color: var(--border);
  background: var(--surface);
  color: var(--text);
}
.btn-outline:hover:not(:disabled) {
  background: var(--surface-3);
}
a.btn-outline {
  color: var(--text);
  align-self: flex-start;
}
.btn-ghost {
  color: var(--text-2);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--surface-3);
  color: var(--text);
}
.btn-success {
  background: var(--success-btn);
  color: #fff;
}
.btn-success:hover:not(:disabled) {
  filter: brightness(1.08);
}
.btn-danger-outline {
  border-color: var(--danger);
  color: var(--danger-text);
  background: var(--surface);
}
.btn-danger-outline:hover:not(:disabled) {
  background: var(--danger-subtle);
}

/* theme switch */
.theme-switch {
  border: 0;
  background: none;
  padding: 4px;
  cursor: pointer;
  border-radius: 999px;
}
.theme-switch-track {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 52px;
  height: 26px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--text-2);
}
.theme-switch-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--primary);
  transition: transform 0.2s;
}
[data-theme="dark"] .theme-switch-thumb {
  transform: translateX(26px);
}
.ts-sun,
.ts-moon {
  position: relative;
  z-index: 1;
}
[data-theme="light"] .ts-sun,
[data-theme="dark"] .ts-moon {
  color: #fff;
}

/* ---------- badges, chips, tags ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  line-height: 18px;
}
.badge-primary {
  background: var(--primary-subtle);
  color: var(--primary-text);
}
.badge-success {
  background: var(--success-subtle);
  color: var(--success-text);
}
.badge-danger {
  background: var(--danger-subtle);
  color: var(--danger-text);
}
.badge-warning {
  background: var(--warning-subtle);
  color: var(--warning-text);
}
.badge-info {
  background: var(--info-subtle);
  color: var(--info-text);
}
.badge-secondary {
  background: var(--secondary-subtle);
  color: var(--secondary-text);
}
.chip {
  display: inline-block;
  padding: 1px 7px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 11.5px;
  color: var(--text-2);
  background: var(--surface-2);
}
.platform-tag,
.type-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: none;
  display: inline-block;
}
.post-type {
  font-size: 11.5px;
  padding: 0 6px;
  border-radius: 4px;
  background: var(--surface-3);
  color: var(--text-2);
}

/* ---------- alerts ---------- */
.alert {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 14px;
  border-radius: var(--radius);
  border: 1px solid transparent;
}
.alert .icon {
  margin-top: 2px;
}
.alert-info {
  background: var(--info-subtle);
  color: var(--info-text);
  border-color: color-mix(in srgb, var(--info) 30%, transparent);
}
.alert-warning {
  background: var(--warning-subtle);
  color: var(--warning-text);
  border-color: color-mix(in srgb, var(--warning) 35%, transparent);
}
.alert-danger {
  background: var(--danger-subtle);
  color: var(--danger-text);
  border-color: color-mix(in srgb, var(--danger) 30%, transparent);
}
.alert-success {
  background: var(--success-subtle);
  color: var(--success-text);
  border-color: color-mix(in srgb, var(--success) 30%, transparent);
}
.alert .link {
  color: inherit;
}

/* ---------- tables ---------- */
.table-wrap {
  overflow-x: auto;
}
.table {
  width: 100%;
  border-collapse: collapse;
}
.table th {
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--surface-2);
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
/* a long header may take two lines rather than make the whole table wider than the window */
.table-wrap > .table > thead > tr > th {
  white-space: normal;
}
.table-wrap > .table > thead .th-sort {
  white-space: normal;
  text-align: left;
}
.table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.table tbody tr:last-child td {
  border-bottom: 0;
}
.table .num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.table .rank {
  width: 36px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.table-sm td,
.table-sm th {
  padding: 6px 10px;
}
.table-hover tbody tr.row-click {
  cursor: pointer;
}
.table-hover tbody tr.row-click:hover td {
  background: var(--surface-2);
}
.row-you td {
  background: color-mix(in srgb, var(--primary) 6%, transparent);
}
.row-selected td {
  background: color-mix(in srgb, var(--viz-2) 9%, transparent);
}
.row-selected td:first-child {
  box-shadow: inset 3px 0 0 var(--viz-2);
}
.sel-mark {
  color: var(--viz-2);
  font-size: 10px;
}
.post-cell {
  min-width: 220px;
  max-width: 520px;
}
.post-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 3px;
}
.post-caption {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* small picture of the post, reel or album */
.post-with-thumb {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.post-with-thumb > .post-text {
  min-width: 0;
  flex: 1;
}
.post-thumb {
  flex: none;
  width: 56px;
  height: 56px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3, var(--text-2));
  position: relative;
}
.post-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
a.post-thumb:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.post-thumb .thumb-badge {
  position: absolute;
  right: 3px;
  top: 3px;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.post-thumb .thumb-badge svg {
  width: 12px;
  height: 12px;
}
.viz-table {
  max-height: 300px;
  overflow: auto;
}

/* ---------- charts ---------- */
.viz {
  position: relative;
  width: 100%;
}
.viz-plot {
  position: relative;
}
.viz svg {
  display: block;
  overflow: visible;
}
.viz-grid {
  stroke: var(--viz-grid);
  stroke-width: 1;
  shape-rendering: crispEdges;
}
.viz-axis {
  stroke: var(--viz-axis);
  stroke-width: 1;
  shape-rendering: crispEdges;
}
.viz-crosshair {
  stroke: var(--text-3);
  stroke-width: 1;
  shape-rendering: crispEdges;
}
.viz-tick {
  fill: var(--viz-text);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.viz-endlabel {
  fill: var(--text);
  font-size: 11.5px;
  font-weight: 600;
}
.viz-dot {
  stroke: var(--surface);
  stroke-width: 2;
}
.viz-bar-label {
  fill: var(--text-2);
  font-size: 12.5px;
}
.viz-bar-label.strong {
  fill: var(--text);
  font-weight: 600;
}
.viz-bar-value {
  fill: var(--text);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.viz-bar-row {
  outline: none;
  cursor: default;
}
.viz-bar-row.hovered .viz-bar {
  filter: brightness(1.12);
}
.viz-bar-row:focus-visible .viz-bar-label {
  text-decoration: underline;
}
.viz-legend {
  list-style: none;
  margin: 0 0 8px;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  font-size: 12.5px;
  color: var(--text-2);
}
.viz-legend li {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.viz-legend.compact {
  margin: 0;
  gap: 4px 12px;
  font-size: 12px;
}
.key-line {
  width: 14px;
  height: 2px;
  border-radius: 2px;
  display: inline-block;
  flex: none;
}
.key-rect {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
  flex: none;
}
.viz-tooltip {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  min-width: 150px;
  max-width: 220px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 8px 10px;
  font-size: 12px;
}
.viz-tooltip-title {
  color: var(--text-2);
  margin-bottom: 4px;
}
.viz-tooltip-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.viz-tooltip-row strong {
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

/* ---------- forms ---------- */
.form-select,
.form-input {
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  min-width: 0;
}
.form-select {
  padding-right: 28px;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
.form-select:focus,
.form-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 0.2rem var(--focus-ring);
}
.form-input.time {
  width: 132px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.field-label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-2);
}
.field-hint {
  font-size: 12px;
  color: var(--text-2);
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}

/* ---------- modal ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(8, 10, 12, 0.5);
  display: grid;
  place-items: center;
  padding: 16px;
}
.modal {
  width: 100%;
  max-width: 520px;
  max-height: calc(100vh - 32px);
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  outline: none;
}
.modal-wide {
  max-width: 640px;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 12px 12px 18px;
  border-bottom: 1px solid var(--border);
}
.modal-header h2 {
  font-size: 16px;
}
.modal-body {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.modal-footer {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 12px 18px;
  border-top: 1px solid var(--border);
}
.settings-section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.settings-section h3 {
  font-size: 14px;
}
.settings-section p {
  margin: 0;
}
.settings-row {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}
.settings-test {
  display: flex;
}

/* ---------- empty ---------- */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 32px 16px;
  color: var(--text-3);
}
.empty-title {
  margin: 8px 0 0;
  color: var(--text);
  font-weight: 600;
}
.empty-hint {
  margin: 4px 0 0;
  color: var(--text-2);
  max-width: 48ch;
}

/* ---------- schedule ---------- */
.cal-nav {
  display: flex;
  align-items: center;
  gap: 6px;
}
.cal-label {
  font-weight: 600;
  margin-left: 6px;
  white-space: nowrap;
}
.appt-card {
  border: 1px solid var(--border);
  border-top: 3px solid var(--primary);
  border-radius: var(--radius-lg);
  padding: 14px;
  background: var(--surface);
  align-self: start; /* opening one card's form answers doesn't stretch the others */
}
.appt {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.appt-when {
  display: flex;
  flex-direction: column;
}
.appt-rel {
  font-weight: 700;
  font-size: 13px;
  color: var(--primary-text);
}
.appt-title {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  font-size: 16px;
  font-weight: 600;
}
.appt-contact {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 13px;
}
.appt-contact a,
.appt-contact span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
  text-decoration: none;
  word-break: break-all;
}
.appt-contact a:hover {
  color: var(--primary-text);
  text-decoration: underline;
}
.appt-form {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
}
.appt-form-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-2);
  margin-bottom: 6px;
}
.appt-form dl {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
/* one answer: icon, short label, the answer */
.form-row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.form-icon {
  flex: none;
  width: 18px;
  height: 18px;
  margin-top: 1px;
  color: var(--primary-text);
  display: inline-flex;
}
.form-icon svg {
  width: 18px;
  height: 18px;
}
.form-row.kind-other .form-icon,
.form-row.kind-phone .form-icon {
  color: var(--text-2);
}
.form-row.kind-privacy .form-icon {
  color: var(--text-2);
}
.form-row.kind-privacy.paid .form-icon {
  color: var(--danger);
}
.form-body {
  min-width: 0;
  flex: 1;
}
.form-body dt {
  margin-bottom: 2px;
}
.chips {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
}
.chip {
  --chip: var(--text-2);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 8px 1px 6px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 20px;
  color: color-mix(in oklab, var(--chip) 62%, var(--text));
  background: color-mix(in oklab, var(--chip) 16%, var(--surface));
  border: 1px solid color-mix(in oklab, var(--chip) 38%, var(--surface));
  white-space: normal;
}
.chip svg {
  width: 15px;
  height: 15px;
  flex: none;
}
.swatch-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 1px 8px 1px 4px;
  border-radius: 999px;
  font-size: 12.5px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.swatch {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--text) 25%, transparent);
  flex: none;
}
.answer-list {
  margin: 0;
  padding-left: 16px;
}
.answer-list li + li {
  margin-top: 1px;
}
.appt-form dt {
  font-size: 12px;
  color: var(--text-2);
  white-space: pre-line;
}
.appt-form dd {
  margin: 0;
  font-size: 13px;
  white-space: pre-line; /* multiple choices come one per line */
  overflow-wrap: anywhere;
}

.dayview {
  position: relative;
  margin-left: 56px;
}
.dayview-hour {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px solid var(--viz-grid);
}
.dayview-time {
  position: absolute;
  left: -56px;
  top: -9px;
  font-size: 11px;
  color: var(--viz-text);
  font-variant-numeric: tabular-nums;
}
.dayview-now {
  position: absolute;
  left: -6px;
  right: 0;
  border-top: 2px solid var(--danger);
  z-index: 2;
}
.dayview-now::before {
  content: "";
  position: absolute;
  left: -4px;
  top: -5px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--danger);
}
.dayview-event {
  position: absolute;
  left: 8px;
  right: 8px;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 6px 10px;
  text-align: left;
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: var(--radius);
  background: var(--surface-2);
  cursor: pointer;
  overflow: hidden;
  font-size: 12.5px;
}
.dayview-event:hover {
  background: var(--surface-3);
}

.month {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}
.month-dow {
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  text-transform: capitalize;
}
.month-cell {
  min-height: 104px;
  padding: 4px 6px 6px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.month-cell:nth-child(7n + 7) {
  border-right: 0;
}
.month-cell:nth-last-child(-n + 7) {
  border-bottom: 0;
}
.month-cell.outside {
  background: var(--surface-2);
}
.month-cell.outside .month-day {
  color: var(--text-3);
}
.month-day {
  align-self: flex-start;
  border: 0;
  background: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.month-day:hover {
  background: var(--surface-3);
}
.month-cell.today .month-day {
  background: var(--primary);
  color: #fff;
}
.month-event {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  cursor: pointer;
  font-size: 11.5px;
  text-align: left;
  min-width: 0;
}
.month-event:hover {
  background: var(--surface-3);
}
.month-event-time {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.month-event-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-2);
}
.month-more {
  border: 0;
  background: none;
  padding: 0 6px;
  text-align: left;
  font-size: 11.5px;
  color: var(--primary-text);
  cursor: pointer;
  font-weight: 600;
}

/* ---------- manage ---------- */
.manage-table td {
  vertical-align: middle;
}
.agent-cell {
  min-width: 180px;
  max-width: 380px;
}
.agent-desc {
  margin: 2px 0 6px;
}
.agent-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.schedule-editor {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-width: 170px;
}
/* second line of the schedule: the model, then the time (weekly/monthly) or "days back" beside it */
.schedule-row2 {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  margin-top: 6px;
}
.schedule-row2 > .model-field,
.schedule-row2 > .lookback-field {
  margin-top: 0;
}
/* Manage's schedule: on a wide window two lines (frequency + day, then model + time or "days back"), with the
   column given the room for it; on a narrower one the time and "days back" keep their own lines, as before */
.only-wide {
  display: none !important;
}
@media (min-width: 1200px) {
  .only-wide {
    display: revert !important;
  }
  .lookback-field.only-wide {
    display: inline-flex !important;
  }
  .only-narrow {
    display: none !important;
  }
  td:has(> .schedule-editor) {
    min-width: 370px;
  }
  .schedule-row2 > .model-field {
    flex-wrap: nowrap;
  }
}
.form-input.time.time-sm {
  height: 28px;
  padding-top: 0;
  padding-bottom: 0;
}
.lookback-field {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.form-input.lookback {
  width: 64px;
  height: 28px;
  padding: 0 6px;
}
.model-field {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 6px;
  margin-top: 6px;
}
.form-select.model-select {
  width: auto;
  flex-shrink: 0;
  height: 28px;
  padding-top: 0;
  padding-bottom: 0;
}
.run-cell {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  min-width: 120px;
}
.run-msg {
  max-width: 220px;
}
.row-actions {
  display: inline-flex;
  flex-wrap: wrap; /* the buttons go under each other rather than make the table wider than the window */
  gap: 6px;
  justify-content: flex-end;
}

/* ---------- responsive ---------- */
/* ---------- prices tab ---------- */
.nowrap {
  white-space: nowrap;
}
.tab-count {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--warning);
  color: #3a2a00;
  font-size: 11px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
}
.cat-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.cat-pill {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text-2);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.cat-pill:hover {
  border-color: var(--border-strong);
  color: var(--text);
}
.cat-pill.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.cat-count {
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  opacity: 0.75;
}
.cat-dot {
  position: absolute;
  top: -2px;
  right: -2px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--warning);
  border: 2px solid var(--surface);
}
.table-wrap > .price-table > thead th,
.table-wrap > .price-table > thead .th-sort {
  white-space: nowrap; /* "На кадър*", "Доп. кадър": headers on one line */
}
.price-table tbody + tbody {
  border-top: 2px solid var(--border);
}
.price-table .group-row td {
  background: var(--surface-2);
  padding-top: 8px;
  padding-bottom: 8px;
}
.price-table .group-you .group-row td {
  background: color-mix(in srgb, var(--primary) 10%, var(--surface));
}
.price-table .group-you tr:not(.group-row):not(.detail-row) td {
  background: color-mix(in srgb, var(--primary) 4%, transparent);
}
.studio-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 10px;
}
.studio-head a {
  text-decoration: none;
}
.studio-head a:hover {
  text-decoration: underline;
}
.studio-session {
  color: var(--text-2);
}
.studio-session::before {
  content: "· ";
}
.studio-checked {
  margin-left: auto;
}
.price-table tr.row-click {
  cursor: pointer;
}
.price-table tr.row-click:hover td {
  background: var(--surface-2);
}
.price-table tr.row-changed td {
  background: color-mix(in srgb, var(--warning) 13%, transparent) !important;
}
.price-table tr.row-changed td:first-child {
  box-shadow: inset 3px 0 0 var(--warning);
}
.price-table tr.row-open td {
  border-bottom-color: transparent;
}
.offer-name {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 8px;
}
.offer-caret {
  color: var(--text-3);
  transition: transform 0.15s;
  flex: none;
}
.offer-caret.open {
  transform: rotate(90deg);
}
.offer-notes {
  margin: 2px 0 0 22px;
}
.history-mark {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 11.5px;
  color: var(--text-2);
}
.change-mark {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 2px;
  margin-top: 2px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--warning-text);
}
.change-what {
  white-space: nowrap;
}
.change-what .icon,
.notice-what .icon {
  vertical-align: -2px;
  margin-right: 3px;
}
.row-unread td:first-child {
  box-shadow: inset 3px 0 0 var(--warning);
}
.detail-row td {
  background: var(--surface-2);
  padding-top: 4px;
}
.offer-detail {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px 28px;
  padding: 4px 0 6px 22px;
}
.detail-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 6px;
}
.offer-quotes ul {
  margin: 0 0 8px;
  padding-left: 16px;
}
.offer-quotes li {
  margin: 2px 0;
}
.offer-history .table {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.range-chart {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.range-row {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr) 130px;
  align-items: center;
  gap: 14px;
}
.range-label {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  font-weight: 600;
}
.range-label > span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.range-row.you .range-label {
  color: var(--primary-text);
}
.range-track {
  position: relative;
  height: 22px;
}
.range-grid {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--viz-grid);
}
.range-bar {
  position: absolute;
  top: 9px;
  height: 4px;
  border-radius: 2px;
  background: var(--viz-neutral);
}
.range-dot {
  position: absolute;
  top: 5px;
  width: 12px;
  height: 12px;
  margin-left: -6px;
  border-radius: 50%;
  background: var(--viz-2);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--viz-2) 50%, transparent);
  cursor: default;
}
.range-row.you .range-bar {
  background: color-mix(in srgb, var(--viz-1) 45%, var(--surface));
}
.range-row.you .range-dot {
  background: var(--viz-1);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--viz-1) 50%, transparent);
}
.range-values {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
  white-space: nowrap;
}
.range-axis .range-track {
  height: 16px;
}
.range-tick {
  position: absolute;
  transform: translateX(-50%);
  color: var(--viz-text);
  white-space: nowrap;
}

/* ---------- price-change notice (all tabs) ---------- */
.notice {
  border: 1px solid color-mix(in srgb, var(--warning) 45%, transparent);
  background: var(--warning-subtle);
  color: var(--warning-text);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
}
.notice-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 10px;
}
.notice-icon {
  display: inline-flex;
  width: 28px;
  height: 28px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--warning);
  color: #3a2a00;
  flex: none;
}
.notice-title {
  font-size: 15px;
}
.notice-actions {
  margin-left: auto;
  display: flex;
  gap: 6px;
}
.notice-actions .btn {
  color: var(--warning-text);
  border-color: color-mix(in srgb, var(--warning) 60%, transparent);
  background: transparent;
}
.notice-list {
  list-style: none;
  margin: 8px 0 0;
  padding: 0 0 0 38px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.notice-list li {
  display: flex;
  align-items: center;
  gap: 4px;
}
.notice-item {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 10px;
  text-align: left;
  border: 0;
  background: transparent;
  color: inherit;
  padding: 4px 6px;
  border-radius: var(--radius);
  cursor: pointer;
  font: inherit;
}
.notice-item:hover {
  background: color-mix(in srgb, var(--warning) 18%, transparent);
}
.notice-offer {
  color: color-mix(in srgb, var(--warning-text) 80%, var(--text-2));
}
.notice-what {
  font-weight: 600;
  margin-left: auto;
}
.notice-x {
  border: 0;
  background: transparent;
  color: inherit;
  padding: 4px;
  border-radius: var(--radius);
  cursor: pointer;
  opacity: 0.7;
}
.notice-x:hover {
  opacity: 1;
  background: color-mix(in srgb, var(--warning) 18%, transparent);
}
.notice-more {
  margin: 4px 0 0 44px;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
@media (max-width: 900px) {
  .offer-detail {
    grid-template-columns: minmax(0, 1fr);
  }
  .range-row {
    grid-template-columns: 110px minmax(0, 1fr);
  }
  .range-values {
    grid-column: 2;
    text-align: left;
    margin-top: -6px;
  }
  .range-axis .range-values {
    display: none;
  }
  .notice-what {
    margin-left: 0;
  }
  .notice-list {
    padding-left: 0;
  }
  .table-search input {
    width: 110px;
  }
  .notice-more {
    margin-left: 6px;
  }
}

/* ---------- table sorting / filtering / search (kept discreet) ---------- */
.th-inner {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  max-width: 100%;
}
th.num .th-inner {
  justify-content: flex-end;
}
.th-sort {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  color: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.th-sort:hover {
  color: var(--text);
}
.th-sort-icon {
  opacity: 0.28;
  transition: opacity 0.12s;
  flex: none;
}
.th-sort:hover .th-sort-icon,
.th-sort:focus-visible .th-sort-icon {
  opacity: 0.7;
}
.th-sorted,
.th-sorted .th-sort {
  color: var(--primary-text);
}
.th-sorted .th-sort-icon {
  opacity: 1;
}
.th-filter {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  margin-left: 2px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: none;
  color: var(--text-3);
  cursor: pointer;
  flex: none;
}
.th-filter:hover,
.th-filter[aria-expanded="true"] {
  color: var(--text);
  background: var(--surface-3);
}
.th-filter.active {
  color: var(--primary-text);
  background: var(--primary-subtle);
}
.th-filter-count {
  position: absolute;
  top: -4px;
  right: -5px;
  min-width: 13px;
  height: 13px;
  padding: 0 3px;
  border-radius: 999px;
  background: var(--primary);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  line-height: 13px;
  text-align: center;
}
.filter-pop {
  position: fixed;
  z-index: 60;
  width: 230px;
  max-height: 320px;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
  font-size: 13px;
  font-weight: 400;
  text-align: left;
  white-space: normal;
}
.filter-pop-title {
  padding: 8px 12px 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.filter-pop-list {
  overflow-y: auto;
  padding: 2px 4px;
}
.filter-pop-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: var(--radius);
  cursor: pointer;
}
.filter-pop-item:hover {
  background: var(--surface-2);
}
.filter-pop-item input {
  accent-color: var(--primary);
  margin: 0;
}
.filter-pop-label {
  flex: 1;
  min-width: 0;
}
.filter-pop-foot {
  padding: 6px 12px 8px;
  border-top: 1px solid var(--border);
}
.filter-pop-foot .link:disabled {
  color: var(--text-3);
  cursor: default;
  text-decoration: none;
}
.table-tools {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.table-search-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: none;
  color: var(--text-3);
  cursor: pointer;
}
.table-search-btn:hover {
  color: var(--text);
  background: var(--surface-3);
}
.table-search {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 4px 0 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text-3);
}
.table-search:focus-within {
  border-color: var(--primary);
}
.table-search input {
  width: 150px;
  border: 0;
  outline: 0;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: 13px;
}
.table-search input::-webkit-search-cancel-button {
  display: none;
}
.table-search-x {
  display: inline-flex;
  padding: 3px;
  border: 0;
  border-radius: 4px;
  background: none;
  color: var(--text-3);
  cursor: pointer;
}
.table-search-x:hover {
  color: var(--text);
  background: var(--surface-3);
}
.table .no-match td {
  text-align: center;
  padding: 18px 12px;
}
.show-more {
  padding: 8px 12px 10px;
  border-top: 1px solid var(--border);
  text-align: center;
}
.show-more .link,
.no-match .link {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.offer-studio {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  padding: 0 6px;
  border-radius: 4px;
  background: var(--surface-3);
  white-space: nowrap;
}

/* ---------- clients ---------- */
.client-table tr.row-click,
.review-table tr {
  cursor: default;
}
.client-table tr.row-click {
  cursor: pointer;
}
.client-table tr.row-click:hover td {
  background: var(--surface-2);
}
.client-table tr.row-open td {
  border-bottom-color: transparent;
}
.client-table tr.row-muted td {
  opacity: 0.6;
}
.client-rel {
  display: block;
  line-height: 1.2;
}
.client-upcoming {
  color: var(--info-text, var(--primary-text));
  font-weight: 600;
}
.client-types {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 10px;
}
.client-detail {
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
  gap: 16px 28px;
  padding: 4px 0 8px 22px;
}
.client-detail .detail-title {
  margin-top: 10px;
}
.client-detail .detail-title:first-child {
  margin-top: 0;
}
.client-contacts {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 16px;
}
.client-contacts a {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  text-decoration: none;
}
.client-contacts a:hover {
  text-decoration: underline;
}
.client-sessions {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.client-session {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
/* one row per session, in fixed columns so dates, types, tags and status line up from row to row */
.client-session summary {
  display: grid;
  grid-template-columns: 7.2em 7.4em minmax(0, 1fr) 4.9em 8.4em 5.8em;
  align-items: center;
  gap: 4px 10px;
  padding: 6px 10px;
  cursor: pointer;
  list-style: none;
}
.client-session summary::-webkit-details-marker {
  display: none;
}
.client-session.canceled summary {
  color: var(--text-2);
}
.session-date,
.pay-date {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.session-type,
.session-tag,
.session-status {
  display: flex;
  min-width: 0;
}
.session-status {
  justify-content: flex-end;
}
.client-session-title {
  min-width: 0;
}
.session-moved {
  display: block;
  font-weight: 400;
}
.session-moved.text-warning {
  color: var(--warning-text);
}
/* the booked package: soft tags, stronger colour for the bigger package */
.pkg-tag {
  display: inline-flex;
  align-items: center;
  padding: 0 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  line-height: 18px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.pkg-mini {
  background: #eceff3;
  color: #445064;
}
.pkg-classic {
  background: #f7e7d8;
  color: #7a4418;
}
.pkg-middle {
  background: #efe3fb;
  color: #5f2596;
}
.pkg-maxi {

  color: #6b4f00;
}
.pkg-other {

}
[data-theme="dark"] .pkg-mini {
  background: #343c4a;
  color: #d3dae6;
}
[data-theme="dark"] .pkg-classic {

}

  color: #e3cffd;
}

  color: #f7df86;
}
.client-form {
  display: grid;

}
.client-form dt {

}
.client-form dd {

}
.client-pay {

  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.client-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;

.acct-tag {

}
.acct-dsk {

}
.acct-paysera {

}
.acct-cash {

}
[data-theme="dark"] .acct-cash {

}
.acct-bank {

}
.acct-voucher {
  background: #b0306e;
}
.acct-other {

  color: var(--secondary-text);
}
.pay-from {

  flex-wrap: wrap;

}
.cash-form {

}
.cash-form .detail-title.cash-form-title {

  align-items: center;
  gap: 8px;
  margin: 0;
}
.cash-form .field-wide,
.cash-form-actions {
  grid-column: 1 / -1;
}
.cash-form .form-input,
.cash-form .form-select {
  width: 100%;
}
.cash-amount {

  gap: 6px;
}
.cash-amount .form-select {

}
.cash-form-actions {

.form-input.is-invalid {

}
.pay-note {
  color: var(--text-2);

}
.review-select {

}
.review-sender {

}
.review-actions {

  align-items: center;

}
.card-pad {

}
.check-row {

  align-items: center;

}
.public-landing {

}
.public-landing .landing-mark {

}
.public-landing h2 {

}
.public-landing p {
  margin: 0 0 16px;
}
.block {

}
.text-danger {
  color: var(--danger-text);
}
@media (max-width: 900px) {
  .client-detail {
    grid-template-columns: minmax(0, 1fr);

    left: 12px;
    max-width: calc(100vw - 58px);

  .client-form,
  .cash-form {

  }

    margin-bottom: 6px;
  }
}

@media (max-width: 1200px) {
  .grid-kpi {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .grid-2 {
    grid-template-columns: minmax(0, 1fr);
  }
}
@media (max-width: 900px) {
  .grid-3 {
    grid-template-columns: minmax(0, 1fr);
  }
  .grid-kpi.four {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 359px) {

}
@media (max-width: 640px) {

    gap: 10px;
  }
  .brand {
    gap: 8px;
  }
  .brand-name {

    line-height: 1.1;

  }
  .header-actions {

  }
  .filters-meta {

  }

  .month-cell {

    padding: 2px;

  .month-event-time,
  .month-event-title {

  .month-event {

    justify-content: center;

  .stat-value {
    font-size: 22px;
  }
}

/* ---------- marketing ---------- */
.grid-2.mk-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.mk-summary {
  margin: 0;
  font-size: 14.5px;
  line-height: 1.55;
}
.mk-points {

  padding: 0;
  list-style: none;
  display: flex;

  gap: 16px;

}
.mk-points li {
  position: relative;

}
.mk-points li::before {

  left: 0;

  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 12px;

}
.mk-points h3,
.mk-idea h3 {
  margin: 0 0 4px;

  font-weight: 600;
}
.mk-points p {
  margin: 0;
  color: var(--text-2);
  line-height: 1.5;
}
.mk-evidence {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-3);
}
.mk-evidence summary {

}
.mk-evidence ul {

}
.mk-evidence li {

}
.mk-evidence code {

}
.mk-evidence span {

}
.mk-timing {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.mk-timing p {
  margin: 0;
}
.mk-timing-head {

  flex-wrap: wrap;
  gap: 4px 12px;
  align-items: baseline;
}
.mk-range {
  font-weight: 600;
  white-space: nowrap;
}
.mk-track {
  position: relative;
  height: 6px;
  border-radius: 3px;
  background: var(--surface-3);

}
.mk-bar {

}
.mk-ideas {
  list-style: none;
  margin: 0;
  padding: 0;
}
.mk-idea {
  padding: 16px 0;

}
.mk-idea:first-child {
  padding-top: 0;

}
.mk-idea:last-child {

}
.mk-idea > p {

}
.mk-idea-meta {

}
.mk-draft {
  background: var(--surface-2);
  border: 1px solid var(--border);

}
.mk-draft p {

}
.mk-draft-subject {

}
.mk-draft-text {

}
.mk-draft-tags {

}
.mk-idea-actions {

}
.mk-audience {

  grid-template-columns: repeat(4, minmax(0, 1fr));

}
.mk-audience div {
  background: var(--surface-2);

  padding: 10px 12px;
}
.mk-audience dt {
  font-size: 12px;
  color: var(--text-2);
}
.mk-audience dd {
  margin: 2px 0 0;
  font-size: 18px;
  font-weight: 600;
}
.mk-advice {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;

}
.mk-advice li {

.mk-advice li .icon {

.mk-signup {

  gap: 8px;

}
.modal:has(.mk-email-frame) {

}
.modal:has(.mk-email-frame) .modal-footer {

}
.mk-email-frame {

  height: min(70vh, 900px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #ffffff;
}
.mk-preview-text {
  margin: 0;
  font-size: 13px;
}
.mk-preview-note {
  margin-right: auto;
}
@media (max-width: 1200px) {
  .grid-2.mk-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}
@media (max-width: 640px) {
  .mk-audience {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* ---------- marketing: channel accents ---------- */
/* The Marketing tab only: each channel, and each part of the analyst's write-up, has an accent (icons and text; AA
   contrast on the card and on its own tint, checked for both themes) and a very light tint. Dark theme: light
   accents on dark tints, never pastel boxes. A card or tile takes its colours from the nearest .mk-tone-*. */
:root,
[data-theme="light"] {
  --mk-fb: #2f62c4;
  --mk-fb-soft: #e9f0fc;
  --mk-ig: #a83b6e;
  --mk-ig-soft: #fbecf3;
  --mk-web: #0a7a71;
  --mk-web-soft: #e2f4f1;
  --mk-email: #a9520c;
  --mk-email-soft: #fdf0e2;
  --mk-focus: #1b7a43;
  --mk-focus-soft: #e5f4eb;
  --mk-improve: #8f5b00;
  --mk-improve-soft: #fdf2da;
  --mk-timing: #2a62b0;
  --mk-timing-soft: #e8f0fb;
  --mk-ideas: #5e44b8;
  --mk-ideas-soft: #efeafb;
  --mk-warm-bg: #fdf7ee;
  --mk-warm-border: #f0e0c6;
}
[data-theme="dark"] {
  --mk-fb: #8fb2f4;
  --mk-fb-soft: rgba(110, 150, 235, 0.16);
  --mk-ig: #ee9cc3;
  --mk-ig-soft: rgba(230, 120, 170, 0.15);
  --mk-web: #6fd3c6;
  --mk-web-soft: rgba(60, 190, 175, 0.15);
  --mk-email: #f3b37a;
  --mk-email-soft: rgba(240, 160, 90, 0.15);
  --mk-focus: #7fd8a1;
  --mk-focus-soft: rgba(80, 200, 130, 0.14);
  --mk-improve: #f2c56b;
  --mk-improve-soft: rgba(240, 180, 60, 0.14);
  --mk-timing: #93bdf2;
  --mk-timing-soft: rgba(100, 160, 235, 0.15);
  --mk-ideas: #b9a8f2;
  --mk-ideas-soft: rgba(150, 125, 235, 0.16);
  --mk-warm-bg: #2b2c31;
  --mk-warm-border: rgba(240, 180, 100, 0.22);
}
.mk-tone-overview {
  --mk-accent: var(--primary-text);
  --mk-soft: var(--primary-subtle);
}
.mk-tone-fb {
  --mk-accent: var(--mk-fb);
  --mk-soft: var(--mk-fb-soft);
}
.mk-tone-ig {
  --mk-accent: var(--mk-ig);
  --mk-soft: var(--mk-ig-soft);
}
.mk-tone-web {
  --mk-accent: var(--mk-web);
  --mk-soft: var(--mk-web-soft);
}
.mk-tone-email,
.mk-tone-summary {
  --mk-accent: var(--mk-email);
  --mk-soft: var(--mk-email-soft);
}
.mk-tone-focus {
  --mk-accent: var(--mk-focus);
  --mk-soft: var(--mk-focus-soft);
}
.mk-tone-improve {
  --mk-accent: var(--mk-improve);
  --mk-soft: var(--mk-improve-soft);
}
.mk-tone-timing {
  --mk-accent: var(--mk-timing);
  --mk-soft: var(--mk-timing-soft);
}
.mk-tone-ideas {
  --mk-accent: var(--mk-ideas);
  --mk-soft: var(--mk-ideas-soft);
}
/* a thin accent line on top of a card */
.card.mk-card {
  border-top: 3px solid var(--mk-accent, var(--border));
}
.mk-title {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
}
.mk-chip,
.stat-chip {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--mk-soft, var(--primary-subtle));
  color: var(--mk-accent, var(--primary-text));
}
.stat-chip {
  width: 22px;
  height: 22px;
  border-radius: 6px;
}
.stat-label:has(.stat-chip) {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mk-subhead {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mk-subhead::before {
  content: "";
  width: 4px;
  height: 14px;
  border-radius: 2px;
  background: var(--mk-accent, var(--primary));
}
/* This week in short: a warm, very light card with easier-to-read text */
.card.mk-summary-card {
  background: var(--mk-warm-bg);
  border-color: var(--mk-warm-border);
}
.mk-summary-card .card-header {
  border-bottom-color: var(--mk-warm-border);
}
.mk-summary-card .mk-summary {
  font-size: 16px;
  line-height: 1.65;
  max-width: 78ch;
}
/* the sub-tabs: a tinted icon each, the open one underlined in its colour */
.mk-subtab-icon {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--mk-soft);
  color: var(--mk-accent);
}
.subtab.mk-subtab.active {
  color: var(--mk-accent);
  border-bottom-color: var(--mk-accent);
}
/* Overview: one number per channel; the whole tile opens its sub-tab */
button.mk-jump {
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  border-top: 3px solid var(--mk-accent);
  transition: background-color 0.15s, border-color 0.15s;
}
button.mk-jump > span {
  display: block;
}
button.mk-jump > .stat-label {
  display: flex;
}
button.mk-jump:hover {
  background: color-mix(in srgb, var(--mk-soft) 55%, var(--surface));
  border-color: var(--mk-accent);
}
button.mk-jump:focus-visible {
  outline: 2px solid var(--mk-accent);
  outline-offset: 2px;
}
.mk-jump-delta {
  margin-left: 6px;
}
.mk-jump-go {
  margin-left: auto;
  color: var(--text-3);
}
button.mk-jump:hover .mk-jump-go {
  color: var(--mk-accent);
}
@media (max-width: 640px) {
  .mk-subtabs {
    gap: 0;
  }
  .mk-subtab {
    padding: 8px 9px 9px;
    gap: 6px;
  }
}

/* ---------- client view: the session a payment is for ---------- */
.pay-session {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}
.client-pay td:nth-child(1) {
  width: 7.6em;
}
.client-pay td:nth-child(2) {
  width: 5.4em;
}
.client-pay td:nth-child(4) {
  width: 2.6em;
}
.client-pay td:nth-child(3) {
  overflow-wrap: anywhere;
}
.pay-session {
  flex-wrap: wrap;
}
.pay-session .form-select {
  width: auto;
  min-width: 0;
  max-width: 100%;
  height: 28px;
  padding-top: 2px;
  padding-bottom: 2px;
  font-size: 12.5px;
}
.pay-warn {
  color: var(--warning-text);
}

/* sessions in the client view, when the column is too narrow for one line:
   date, type and status on top, the title below, then the package and deposit tags */
@media (max-width: 1280px) {
  .client-session summary {
    grid-template-columns: 7.2em auto minmax(0, 1fr) auto;
    grid-template-areas: "date type . status" "title title title title" "pkg dep dep dep";
    gap: 4px 10px;
  }
  .session-date {
    grid-area: date;
  }
  .session-type {
    grid-area: type;
  }
  .session-status {
    grid-area: status;
  }
  .client-session-title {
    grid-area: title;
  }
  .session-tag:nth-of-type(4) {
    grid-area: pkg;
  }
  .session-tag:nth-of-type(5) {
    grid-area: dep;
  }
  .session-tag:empty {
    display: none;
  }
}

/* ---------- a studio's own site icon in front of its name (Prices tab) ---------- */
.studio-name {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  vertical-align: middle;
}
.studio-icon {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  border-radius: 3px;
  object-fit: contain;
}
/* dark theme: a light tile behind the icon, so dark logos stay visible */
[data-theme="dark"] img.studio-icon {
  background: #f4f5f7;
  padding: 1px;
  box-sizing: border-box;
}
.studio-icon-letter {
  display: inline-grid;
  place-items: center;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  color: var(--secondary-text);
  background: var(--secondary-subtle);
}

/* ---------- reports ---------- */
.report-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.report-range {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px 14px;
}
.report-date {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.report-date .form-input {
  width: 150px;
}
.report-summary {
  align-self: center;
  margin-left: auto;
}
.reports-tab .card-note {
  padding: 10px 0 0;
}
.report-print {
  padding: 18px 16px 8px;
}
.report-title {
  margin: 0 0 4px;
  font-size: 18px;
}
.report-note {
  margin: 0;
}
.report-empty {
  margin: 16px 0 12px;
}
.report-table {
  margin-top: 14px;
}
/* on screen the columns share the room by their content (dates never squeezed); the printed report keeps its
   fixed column widths */
@media print {
  .report-table {
    table-layout: fixed;
  }
  .report-table th {
    width: var(--col-w);
  }
}
body.printing-report .report-table {
  table-layout: fixed;
}
.report-legend {
  margin: 0 0 12px;
  line-height: 1.6;
}
.sent-check {
  color: #1b9e3e;
  font-weight: 700;
  font-size: 15px;
}
.report-table .days-left.print-only,

.days-left {

@media screen {
  /* words stay whole ("Алексан/дрина" is hard to read); the button is one word and stays on one line */
  .report-table td {
    overflow-wrap: break-word;
  }
  /* The list as a table (not phone blocks): fixed column widths that don't move with what's in them, headers on
     one line. The name and the session type share what is left; long texts end in "…" (full text on hover). */
  .table-wrap:not([data-narrow]) > .report-table {
    table-layout: fixed;
    width: 100%;
  }
  .table-wrap:not([data-narrow]) > .report-table th {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .table-wrap:not([data-narrow]) > .report-table th:nth-child(1) { width: 48px; }  /* № */
  .table-wrap:not([data-narrow]) > .report-table th:nth-child(4) { width: 128px; } /* session date */
  .table-wrap:not([data-narrow]) > .report-table th:nth-child(5) { width: 128px; } /* photos chosen (+ "непотвърдено") */
  .table-wrap:not([data-narrow]) > .report-table th:nth-child(6) { width: 192px; } /* deadline + "закъснение 12 раб. дни" */
  .table-wrap:not([data-narrow]) > .report-table th:nth-child(7) { width: 140px; } /* the Sent button */
  .report-table .report-clamp2 {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
  }
  /* the name and the children's line: one line each, "…" when longer (the full text shows on hover) */
  .report-table .report-clamp {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 1;
    line-clamp: 1;
    overflow: hidden;
  }
}
.report-table .days-left {
  display: block; /* under the date, on one line: a row is two lines at most */

/* ---------- tables in a box too narrow for them (see TableWrap in table.tsx) ---------- */
/* "rows": each row becomes a block of labelled values, so nothing scrolls sideways */
@media screen {
  .table-wrap[data-fit="rows"][data-narrow] {
    overflow: visible;
  }
  .table-wrap[data-fit="rows"][data-narrow] > table,
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody {
    display: block;
    width: 100%;
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > thead {
    display: none;
  }
  .table-wrap[data-fit="rows"][data-narrow][data-keep-head] > table > thead {
    display: block;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .table-wrap[data-fit="rows"][data-narrow][data-keep-head] > table > thead > tr {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 14px;
    padding: 6px 16px;
  }
  .table-wrap[data-fit="rows"][data-narrow][data-keep-head] > table > thead > tr > th {
    display: block;
    width: auto !important;
    padding: 2px 0;
    background: none;
    border: 0;
  }
  .table-wrap[data-fit="rows"][data-narrow][data-keep-head] > table > thead > tr > th:not(:has(button)) {
    display: none; /* only the sort and filter buttons are kept */
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 8px 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .table-wrap[data-fit="rows"][data-narrow] > table.client-table > tbody > tr {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); /* dates with "3 months ago" need the room */
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr:last-child {
    border-bottom: 0;
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr > td {
    display: block;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    white-space: normal;
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr > td.cell-main,
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr > td.cell-wide,
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr > td.cell-actions,
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr > td[colspan] {
    grid-column: 1 / -1;
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr:has(> td.cell-link) {
    position: relative;
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr > td.cell-link {
    position: absolute; /* a small "open" button: in the block's top corner, not on a line of its own */
    top: 8px;
    right: 10px;
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr:has(> td.cell-link) > td.cell-main {
    padding-right: 32px;
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr > td.cell-extra {
    display: none; /* shown when the row is opened */
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr > td[data-label]::before {
    content: attr(data-label);
    display: block;
    margin-bottom: 2px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-2);
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr.detail-row {
    display: block;
    padding: 0 16px 12px;
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr.row-click:hover,
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr.row-open,
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr.detail-row {
    background: var(--surface-2);
  }
  .table-wrap[data-fit="rows"][data-narrow] > table > tbody > tr.row-unread {
    box-shadow: inset 3px 0 0 var(--warning);
  }
  .table-wrap[data-fit="rows"][data-narrow] .review-select {
    width: 100%;
  }

  /* "compare": the table scrolls sideways with its first column pinned */
  .table-wrap[data-fit="compare"][data-narrow] > table > thead > tr > th:first-child,
  .table-wrap[data-fit="compare"][data-narrow] > table > tbody > tr > td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--surface);
    box-shadow: 1px 0 0 var(--border);
  }
  .table-wrap[data-fit="compare"][data-narrow] > table > thead > tr > th:first-child {
    background: var(--surface-2);
  }
  .table-wrap[data-fit="compare"][data-narrow] > table > tbody > tr.row-click:hover > td:first-child {
    background: var(--surface-2);
  }
  .table-wrap[data-fit="compare"][data-narrow] > table > tbody > tr.row-you > td:first-child {
    background: color-mix(in srgb, var(--primary) 6%, var(--surface));
  }
  .table-wrap[data-fit="compare"][data-narrow] > table > tbody > tr.row-selected > td:first-child {
    background: color-mix(in srgb, var(--viz-2) 9%, var(--surface));
    box-shadow: inset 3px 0 0 var(--viz-2), 1px 0 0 var(--border);
  }
  .table-wrap[data-fit="compare"][data-narrow] > table > tbody > tr.group-row > td:first-child {
    background: var(--surface-2);
  }
  .table-wrap[data-fit="compare"][data-narrow] > table > tbody.group-you > tr.group-row > td:first-child {
    background: color-mix(in srgb, var(--primary) 10%, var(--surface));
  }
  .table-wrap[data-fit="compare"][data-narrow] > table > tbody.group-you > tr:not(.group-row):not(.detail-row) > td:first-child {
    background: color-mix(in srgb, var(--primary) 4%, var(--surface));
  }
}

[data-color="blue"] { --pt-bg: #dcebfa; --pt-fg: #2a5a85; --pt-bd: #bfd9f2; }
[data-color="green"] { --pt-bg: #ddf1e4; --pt-fg: #2f6b45; --pt-bd: #bfe3cb; }
[data-color="lavender"] { --pt-bg: #e9e1f7; --pt-fg: #5a3f8a; --pt-bd: #d5c7f0; }
[data-color="peach"] { --pt-bg: #fbe5d3; --pt-fg: #8a4b22; --pt-bd: #f3cbaa; }
[data-theme="dark"] [data-color="pink"] { --pt-bg: #4a2a33; --pt-fg: #f6c9d3; --pt-bd: #6b3a47; }
[data-theme="dark"] [data-color="blue"] { --pt-bg: #1f3447; --pt-fg: #bfddf7; --pt-bd: #2f4d68; }
[data-theme="dark"] [data-color="green"] { --pt-bg: #20382a; --pt-fg: #bfe8cd; --pt-bd: #2f5240; }
[data-theme="dark"] [data-color="lavender"] { --pt-bg: #33284a; --pt-fg: #dccff6; --pt-bd: #4a3a6b; }
[data-theme="dark"] [data-color="peach"] { --pt-bg: #46301f; --pt-fg: #f6d3b5; --pt-bd: #6a4a30; }
.tag-picks {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.tag-pick {
  display: inline-block;
  width: auto;
  height: auto;
  line-height: 20px;
  padding: 2px 10px;
  border-radius: 999px;
  border: 1px solid;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.tag-pick[aria-pressed="true"] {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* ---------- Manage → Usage ---------- */
.usage-grid {
  align-items: start;
}
.usage-figure {
  display: flex;
  align-items: baseline;
  gap: 4px;
  flex-wrap: wrap;
  margin: 12px 0 8px;
}
.usage-big {
  font-size: 32px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.usage-of {
  font-size: 18px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.usage-unit {
  margin-left: 4px;
}
.usage-meter {
  height: 10px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  overflow: hidden;
}
.usage-meter > span {
  display: block;
  height: 100%;
  min-width: 2px;
  background: var(--success);
  border-radius: inherit;
}
.usage-meter[data-level="warning"] > span {
  background: var(--warning);
}
.usage-meter[data-level="danger"] > span {
  background: var(--danger);
}
.usage-facts {
  display: flex;
  justify-content: space-between;
  gap: 8px 16px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.usage-facts .icon {
  vertical-align: -2px;
}
.usage-note {
  margin: 14px 0 0;
}
.usage-h {
  margin: 18px 0 6px;
  font-size: 13px;
}
.usage-models {
  list-style: none;
  margin: 0;
  padding: 0;
}
.usage-models li {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.usage-models li:last-child {
  border-bottom: 0;
}
